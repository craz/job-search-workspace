services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: job_search
      POSTGRES_USER: job_search
      POSTGRES_PASSWORD: job_search
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_search -d job_search"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  core:
    build: ./services/core
    environment:
      JOB_SEARCH_CORE_DATABASE_URL: postgresql+psycopg://job_search:job_search@postgres:5432/job_search
      JOB_SEARCH_CORE_ARTIFACT_DIR: /var/lib/job-search-core/artifacts
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn job_search_core.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${CORE_PORT:-8000}:8000"
    volumes:
      - ./services/core/src:/app/src:ro
      - core-artifacts:/var/lib/job-search-core/artifacts

  web:
    build: ./services/web
    environment:
      CORE_API_URL: http://core:8000
      OSINT_API_URL: http://osint:8081
      HH_API_URL: http://hh:8092
      # Scoring is on the Compose network (not host.docker.internal — Linux bridge gap).
      SCORING_API_URL: http://scoring:8090
      WEB_LIVE_RELOAD: "1"
    command:
      - uvicorn
      - job_search_web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/src
    depends_on:
      core:
        condition: service_healthy
      # HH/Scoring optional for vacancy review; degrade in UI when unavailable.
      hh:
        condition: service_started
      scoring:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./services/web/src:/app/src:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-job_search}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-job_search}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Defaults avoid clashing with other local brokers on 5672/15672.
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  scoring:
    build: ./services/scoring
    environment:
      JOB_SEARCH_SCORING_CORE_BASE_URL: http://core:8000
      # Overridden to http://ollama-egress:11434 by .local/docker-compose.ollama-egress.yml
      # when `make up` / ollama-host-socket ensure runs (Linux host Ollama).
      JOB_SEARCH_SCORING_OLLAMA_BASE_URL: http://host.docker.internal:11434
      JOB_SEARCH_SCORING_MODEL: job-search-scorer-summary:latest
      SCORING_PROMPT_VERSION: fast-v1
      SCORING_STATE_DIR: /var/lib/job-search-scoring
      SCORING_TIMEOUT_SECONDS: "300"
      SCORING_HTTP_PORT: "8090"
      JOB_SEARCH_SCORING_RABBITMQ_URL: amqp://${RABBITMQ_USER:-job_search}:${RABBITMQ_PASSWORD:-job_search}@rabbitmq:5672/
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "job_search_scoring.api:get_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
      ]
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${SCORING_PORT:-8090}:8090"
    volumes:
      - scoring-state:/var/lib/job-search-scoring

  scoring-worker:
    build: ./services/scoring
    environment:
      JOB_SEARCH_SCORING_CORE_BASE_URL: http://core:8000
      JOB_SEARCH_SCORING_OLLAMA_BASE_URL: http://host.docker.internal:11434
      JOB_SEARCH_SCORING_MODEL: job-search-scorer-summary:latest
      SCORING_PROMPT_VERSION: fast-v1
      SCORING_STATE_DIR: /var/lib/job-search-scoring
      SCORING_TIMEOUT_SECONDS: "300"
      JOB_SEARCH_SCORING_RABBITMQ_URL: amqp://${RABBITMQ_USER:-job_search}:${RABBITMQ_PASSWORD:-job_search}@rabbitmq:5672/
    command:
      [
        "python",
        "-m",
        "job_search_scoring.cli",
        "semantic-batch",
        "work",
        "--concurrency",
        "1",
      ]
    depends_on:
      core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scoring:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - scoring-state:/var/lib/job-search-scoring

  searxng:
    image: ghcr.io/searxng/searxng:2026.7.28-c01178d03
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: job-search-local-internal-only
    healthcheck:
      test: ["CMD", "wget", "-q", "--header", "X-Forwarded-For: 127.0.0.1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./infra/searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-cache:/var/cache/searxng

  osint:
    build: ./services/osint
    entrypoint: ["python", "-m", "job_search_osint.api"]
    environment:
      JOB_SEARCH_OSINT_CORE_BASE_URL: http://core:8000
      OSINT_STATE_DIR: /var/lib/job-search-osint
      OSINT_TIMEOUT_SECONDS: "15"
      OSINT_SEARCH_MAX_ATTEMPTS: "2"
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      core:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - osint-cache:/var/lib/job-search-osint
      - ./services/osint/src:/app/src:ro

  hh:
    build: ./services/hh
    env_file:
      - ./services/hh/.env
    environment:
      CORE_API_URL: http://core:8000
      JOB_SEARCH_HH_EXTERNAL_WRITES_ENABLED: "false"
      JOB_SEARCH_HH_APPLY_LIMIT: "1"
      HH_STATE_DIR: /var/lib/job-search-hh/state
      HH_PROFILE_DIR: /var/lib/job-search-hh/profile
      HH_NOVNC_ENABLED: "1"
      HH_CHROMIUM_INSTALLED: "1"
      HH_NOVNC_PORT: "6080"
      HH_VNC_PORT: "5900"
      HH_DISPLAY: ":99"
      DISPLAY: ":99"
      HH_API_PORT: "8092"
      # Keep Docker DNS / loopback out of the operator proxy; external HH API may still use it.
      # Loopback host HTTP proxies are bridged by `make up` via hh-egress (see
      # docs/runbooks/hh-docker-host-proxy.md) — do not rely on 127.0.0.1 from the container.
      NO_PROXY: "127.0.0.1,localhost,hh,core,web,osint,postgres,searxng,scoring,rabbitmq"
      no_proxy: "127.0.0.1,localhost,hh,core,web,osint,postgres,searxng,scoring,rabbitmq"
      # Redirect comes from services/hh/.env (archive-registered URI).
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.install_opener(urllib.request.build_opener(urllib.request.ProxyHandler({}))); urllib.request.urlopen('http://127.0.0.1:8092/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${HH_NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${HH_OAUTH_PORT:-8767}:8767"
      - "127.0.0.1:${HH_API_PORT:-8092}:8092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hh-state:/var/lib/job-search-hh/state
      - hh-profile:/var/lib/job-search-hh/profile
      - ./services/hh/src:/app/src:ro

volumes:
  postgres-data:
  core-artifacts:
  scoring-state:
  rabbitmq-data:
  searxng-cache:
  osint-cache:
  hh-state:
  hh-profile:
